<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the persisted theme before the stylesheet parses and the bundle
    // mounts, so there is no flash of the wrong theme. localStorage is the
    // fast synchronous cache; the app reconciles against the Rust-side
    // settings store on boot (survives a WebView data reset). With nothing
    // stored, seed from the OS appearance.
    (function () {
      let theme = null;
      try { theme = localStorage.getItem("capdesk-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>CapDesk — Submission Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <div id="overlay-root"></div>

    <nav class="sidebar" id="sidebar">
      <div class="side-head">
        <div class="side-brand">
          <img class="side-logo" src="assets/logo.png" alt="CapDesk">
          <span class="wordmark">CapDesk</span>
        </div>
        <button class="side-toggle" data-action="toggle-nav" title="Toggle sidebar">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <path d="M9 4v16"></path>
          </svg>
        </button>
      </div>

      <div class="side-nav">
        <div class="nav-item active" data-action="nav" data-page="desk">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path>
            </svg>
          </span>
          <span class="nav-label">Submission desk</span>
          <div class="nav-tip">Submission desk</div>
        </div>
      </div>

      <div class="side-theme">
        <button class="theme-row" data-action="toggle-theme" data-page="theme">
          <span class="nav-icon" id="theme-icon"></span>
          <span class="nav-label" id="theme-label">Dark mode</span>
          <div class="nav-tip" id="theme-tip">Dark mode</div>
        </button>
      </div>

      <div class="side-foot">
        <div class="side-avatar" id="side-avatar">SA</div>
        <div class="side-foot-meta">
          <div class="side-foot-name" id="side-foot-name">Santi</div>
          <div class="side-foot-role">Reviewer</div>
        </div>
      </div>
    </nav>

    <main>
      <header data-tauri-drag-region>
        <h1 id="page-title" data-tauri-drag-region>Awaiting decision</h1>
        <div class="header-right">
          <div class="search">
            <span class="search-glyph">⌕</span>
            <input id="search" type="text" placeholder="Search deals"
                   autocomplete="off" spellcheck="false">
          </div>
          <div class="win-controls">
            <button class="win-btn" data-action="win-min" title="Minimize">–</button>
            <button class="win-btn" data-action="win-max" title="Maximize">▢</button>
            <button class="win-btn" data-action="win-close" title="Close">✕</button>
          </div>
        </div>
      </header>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-icon neutral">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h10"></path>
            </svg>
          </div>
          <div class="stat-main">
            <div class="stat-row">
              <span class="stat-value" id="stat-queue">0</span>
              <span class="stat-unit">deals</span>
            </div>
            <div class="stat-label">In queue</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12.5 9.5 18 20 6.5"></path>
            </svg>
          </div>
          <div class="stat-main">
            <div class="stat-row">
              <span class="stat-value green" id="stat-submitted">0</span>
              <span class="stat-unit">deals</span>
            </div>
            <div class="stat-label">Auto-submitted</div>
          </div>
        </div>
      </div>

      <div class="content">
        <section class="queue">
          <div class="tabbar">
            <div class="segmented" id="tabs"></div>
          </div>
          <div class="deal-list" id="deal-list"></div>
        </section>

        <div class="panel-wrap" id="panel-wrap">
          <aside class="panel" id="panel"></aside>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
