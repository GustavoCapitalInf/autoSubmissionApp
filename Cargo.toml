[workspace]
members = ["crates/conduit-core", "crates/conduit-server", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
anyhow = "1"
base64 = "0.22"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
